<style>
  :root {
    --bg: #f9f9f8;
    --surface: #ffffff;
    --surface-2: #f3f4f3;
    --surface-3: #eeeeed;
    --border: #e0e0dc;
    --ink: #1a1c1c;
    --ink-muted: #3f4947;
    --ink-faint: #6f7977;
    --accent: #2f6e68;
    --accent-strong: #234f4b;
    --accent-ink: #ffffff;
    --accent-soft: #e2efec;
    --warn: #ad7326;
    --warn-soft: #f7ecd9;
    --danger: #ba1a1a;
    --danger-soft: #ffdad6;
    --focus-ring: #2f6e68;
    --shadow: 0 2px 10px rgba(26, 28, 28, 0.06);
    --radius-s: 8px;
    --radius-m: 16px;
    --radius-l: 24px;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101515;
      --surface: #171f1e;
      --surface-2: #1d2726;
      --surface-3: #24302e;
      --border: #2c3937;
      --ink: #e8eeec;
      --ink-muted: #9baba5;
      --ink-faint: #6c7c77;
      --accent: #5fb0a6;
      --accent-strong: #7ec4bb;
      --accent-ink: #0a1413;
      --accent-soft: #1d3532;
      --warn: #dba85a;
      --warn-soft: #382d19;
      --danger: #dc8f88;
      --danger-soft: #3a2422;
      --shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #101515;
    --surface: #171f1e;
    --surface-2: #1d2726;
    --surface-3: #24302e;
    --border: #2c3937;
    --ink: #e8eeec;
    --ink-muted: #9baba5;
    --ink-faint: #6c7c77;
    --accent: #5fb0a6;
    --accent-strong: #7ec4bb;
    --accent-ink: #0a1413;
    --accent-soft: #1d3532;
    --warn: #dba85a;
    --warn-soft: #382d19;
    --danger: #dc8f88;
    --danger-soft: #3a2422;
    --shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }

  h1, h2, h3, h4 { font-family: "Noto Serif JP", "Hiragino Mincho ProN", serif; font-weight: 600; text-wrap: balance; margin: 0; color: var(--ink); }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  a { color: inherit; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  .hidden { display: none !important; }

  /* ---------- Login ---------- */
  #view-login {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    background: var(--bg);
  }
  .login-brand {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
    padding: 64px;
    background:
      radial-gradient(600px 400px at 15% 20%, var(--accent-soft), transparent 60%),
      var(--surface-2);
    border-right: 1px solid var(--border);
  }
  .login-mark {
    width: 44px; height: 44px; padding: 7px;
    border-radius: var(--radius-s);
    background: var(--accent);
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: "Noto Serif JP", serif; font-weight: 700; font-size: 20px;
  }
  .login-brand h1 { font-size: 2.4rem; max-width: 8em; }
  .login-brand p { color: var(--ink-muted); max-width: 42ch; font-size: 0.98rem; }
  .login-brand ul { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 10px; }
  .login-brand li { display: flex; gap: 10px; align-items: flex-start; color: var(--ink-muted); font-size: 0.92rem; }
  .login-brand li svg { flex: none; margin-top: 3px; color: var(--accent); }

  .login-panel { display: flex; align-items: center; justify-content: center; padding: 40px; }
  .login-card { width: 100%; max-width: 360px; }
  .login-card h2 { font-size: 1.4rem; margin-bottom: 6px; }
  .login-card .sub { color: var(--ink-muted); font-size: 0.9rem; margin-bottom: 28px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 0.82rem; color: var(--ink-muted); }
  .field input {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.95rem;
  }
  .field input:focus { border-color: var(--accent); }
  .field .hint { font-size: 0.78rem; color: var(--ink-faint); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px;
    border-radius: var(--radius-s);
    border: 1px solid transparent;
    font-size: 0.92rem; font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 120ms ease, border-color 120ms ease, transform 60ms ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); width: 100%; padding: 11px 16px; }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--ink); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-sm { padding: 6px 11px; font-size: 0.82rem; }
  .btn-danger-ghost { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn-danger-ghost:hover { background: var(--danger-soft); }

  .error-box {
    background: var(--danger-soft); color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: var(--radius-s);
    padding: 10px 12px; font-size: 0.85rem; margin-bottom: 16px;
  }
  .demo-note {
    margin-top: 22px; padding: 12px 14px;
    background: var(--surface-2); border: 1px dashed var(--border);
    border-radius: var(--radius-s); font-size: 0.8rem; color: var(--ink-muted);
  }
  .demo-note code { font-family: "JetBrains Mono", monospace; background: var(--surface-3); padding: 1px 5px; border-radius: 4px; }

  /* ---------- App shell ---------- */
  #view-app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--surface-2);
    padding: 20px 14px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .sidebar-brand .mark { width: 30px; height: 30px; padding: 5px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-family: "Noto Serif JP", serif; font-weight: 700; font-size: 15px; flex: none; }
  .sidebar-brand span { font-family: "Noto Serif JP", serif; font-weight: 600; font-size: 1.05rem; }

  .side-group { display: flex; flex-direction: column; gap: 2px; }
  .side-label { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); padding: 0 10px; margin-bottom: 6px; }
  .side-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border-radius: var(--radius-s);
    color: var(--ink-muted); font-size: 0.88rem; cursor: pointer; border: none; background: transparent; text-align: left; width: 100%;
  }
  .side-item:hover { background: var(--surface-3); color: var(--ink); }
  .side-item.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 500; box-shadow: inset 3px 0 0 var(--accent); }
  .side-item .count { font-family: "JetBrains Mono", monospace; font-size: 0.74rem; color: var(--ink-faint); }
  .side-item.active .count { color: var(--accent-strong); }

  .main-col { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 5;
  }
  .search-box {
    flex: 1 1 120px; min-width: 0; max-width: 480px; display: flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-s);
    padding: 8px 12px; color: var(--ink-muted);
  }
  .search-box input { border: none; background: transparent; outline: none; color: var(--ink); font-size: 0.9rem; flex: 1; }
  .search-box svg { flex: none; }
  .topbar-spacer { flex: 1; }
  .icon-btn {
    position: relative;
    width: 36px; height: 36px; border-radius: var(--radius-s); flex: none;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-muted);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn .dot { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); border: 2px solid var(--surface); }

  .user-chip {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); background: var(--surface);
    border-radius: var(--radius-s); padding: 6px 10px 6px 6px; cursor: pointer; font-size: 0.85rem;
    white-space: nowrap; flex: none;
  }
  .user-chip:hover { background: var(--surface-2); }
  .user-chip span:nth-child(2) { max-width: 12ch; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 600; flex: none; }

  .chat-fab-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: var(--radius-s); padding: 8px 14px; font-size: 0.88rem; font-weight: 500; cursor: pointer;
    white-space: nowrap; flex: none;
  }
  .chat-fab-btn:hover { background: var(--accent-strong); }

  .dropdown {
    position: absolute; top: 54px; right: 24px; width: 320px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m);
    box-shadow: var(--shadow); z-index: 20; overflow: hidden;
  }
  .dropdown-header { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.85rem; font-weight: 500; }
  .dropdown-item { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.83rem; cursor: default; }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item .t { color: var(--ink-muted); font-size: 0.74rem; margin-top: 3px; }
  .dropdown-user-item { padding: 10px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .dropdown-user-item:hover { background: var(--surface-2); }
  .dropdown-user-item .name { font-size: 0.86rem; font-weight: 500; }
  .dropdown-user-item .role { font-size: 0.74rem; color: var(--ink-muted); }
  .dropdown-user-item.current { background: var(--accent-soft); }

  main { padding: 28px 32px 60px; flex: 1; }
  .breadcrumb { display: flex; align-items: center; gap: 6px; color: var(--ink-faint); font-size: 0.8rem; margin-bottom: 14px; }
  .breadcrumb button { background: none; border: none; color: var(--ink-muted); cursor: pointer; padding: 0; font-size: 0.8rem; }
  .breadcrumb button:hover { color: var(--accent); text-decoration: underline; }

  .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
  .page-head > button { flex: none; }
  .page-head h2 { font-size: 1.7rem; }
  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tag {
    font-size: 0.74rem; padding: 3px 9px; border-radius: 999px;
    background: var(--surface-3); color: var(--ink-muted); border: 1px solid var(--border);
  }
  .tag.on { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
  .tag-btn { cursor: pointer; }
  .tag-btn:hover { border-color: var(--accent); }

  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .page-card {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--radius-m);
    background: var(--surface); cursor: pointer;
  }
  .page-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .page-card h3 { font-size: 1.02rem; margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
  .page-card .meta { color: var(--ink-faint); font-size: 0.78rem; }
  .page-card .lock { color: var(--ink-faint); flex: none; }
  .page-card .side { text-align: right; flex: none; font-size: 0.76rem; color: var(--ink-faint); }
  .empty-note { color: var(--ink-faint); font-size: 0.88rem; padding: 30px 0; text-align: center; }

  .section-title { font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-faint); margin: 26px 0 12px; }
  .section-title:first-child { margin-top: 0; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab-btn { padding: 9px 4px; margin-right: 18px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--ink-muted); font-size: 0.9rem; cursor: pointer; }
  .tab-btn.active { color: var(--accent-strong); border-color: var(--accent); font-weight: 500; }

  .prose { max-width: 68ch; font-size: 0.96rem; color: var(--ink); }
  .prose p { margin: 0 0 14px; }
  .prose h4 { font-size: 1.05rem; margin: 22px 0 8px; }

  .attach-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; max-width: 68ch; }
  .attach-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--surface-2); font-size: 0.85rem; }
  .attach-item svg { flex: none; color: var(--ink-muted); }
  .attach-item .size { margin-left: auto; color: var(--ink-faint); font-size: 0.76rem; }

  .history-row { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .history-row:last-child { border-bottom: none; }
  .history-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; }
  .history-body { flex: 1; }
  .history-body .who { font-size: 0.88rem; font-weight: 500; }
  .history-body .when { font-size: 0.76rem; color: var(--ink-faint); }
  .history-body .what { font-size: 0.83rem; color: var(--ink-muted); margin-top: 3px; }

  .banner {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-radius: var(--radius-s); font-size: 0.86rem; margin-bottom: 20px;
  }
  .banner.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
  .banner.ok { background: var(--accent-soft); color: var(--accent-strong); border: 1px solid var(--accent); }

  /* ---------- Edit form ---------- */
  .form-grid { display: flex; flex-direction: column; gap: 18px; max-width: 640px; }
  .form-row { display: flex; gap: 16px; }
  .form-row .field { flex: 1; }
  select { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--surface); color: var(--ink); font-size: 0.9rem; width: 100%; }
  textarea {
    width: 100%; min-height: 220px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-s);
    background: var(--surface); color: var(--ink); font-size: 0.92rem; font-family: "IBM Plex Sans JP", sans-serif; resize: vertical; line-height: 1.7;
  }
  .tag-input-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--surface); }
  .tag-input-row input { border: none; outline: none; background: transparent; flex: 1; min-width: 90px; font-size: 0.88rem; color: var(--ink); }
  .tag-chip { display: flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent-strong); padding: 3px 8px; border-radius: 999px; font-size: 0.78rem; }
  .tag-chip button { border: none; background: none; color: inherit; cursor: pointer; padding: 0; display: flex; }
  .upload-zone { border: 1px dashed var(--border); border-radius: var(--radius-s); padding: 16px; text-align: center; color: var(--ink-faint); font-size: 0.82rem; background: var(--surface-2); }
  .form-actions { display: flex; gap: 10px; padding-top: 6px; }
  .switch-row { display: flex; align-items: center; gap: 10px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; color: var(--ink-muted); }

  /* ---------- Admin queue ---------- */
  .queue-item { border: 1px solid var(--border); border-radius: var(--radius-m); padding: 16px 18px; margin-bottom: 12px; background: var(--surface); }
  .queue-item .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 10px; }
  .queue-item h4 { font-size: 1rem; }
  .queue-item .meta { font-size: 0.78rem; color: var(--ink-faint); margin-top: 3px; }
  .diff-box { background: var(--surface-2); border-radius: var(--radius-s); padding: 12px 14px; font-size: 0.84rem; margin-bottom: 12px; }
  .diff-old { color: var(--danger); text-decoration: line-through; opacity: 0.8; }
  .diff-new { color: var(--accent-strong); }
  .queue-actions { display: flex; gap: 8px; }

  /* ---------- Chat panel ---------- */
  #chat-overlay {
    position: fixed; inset: 0; background: rgba(10, 16, 15, 0.32); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity 160ms ease;
  }
  #chat-overlay.open { opacity: 1; pointer-events: auto; }
  #chat-panel {
    position: fixed; top: 0; right: 0; height: 100vh; width: 420px; max-width: 92vw;
    background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow);
    z-index: 41; display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform 200ms ease;
  }
  #chat-overlay.open #chat-panel { transform: translateX(0); }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .chat-head .mark { width: 26px; height: 26px; padding: 4px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: "Noto Serif JP", serif; font-weight: 700; }
  .chat-head strong { font-family: "Noto Serif JP", serif; font-size: 1rem; }
  .chat-head .sub { font-size: 0.74rem; color: var(--ink-faint); }
  .chat-close { margin-left: auto; }
  .chat-scope { padding: 8px 18px; font-size: 0.74rem; color: var(--ink-faint); border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .chat-log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; max-width: 100%; }
  .msg.user { flex-direction: row-reverse; }
  .msg .bubble { padding: 10px 13px; border-radius: var(--radius-m); font-size: 0.87rem; line-height: 1.6; max-width: 84%; }
  .msg.user .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 3px; }
  .msg.ai .bubble { background: var(--surface-2); color: var(--ink); border-bottom-left-radius: 3px; }
  .msg.ai .bubble.denied { background: var(--warn-soft); color: var(--warn); }
  .cite-list { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; }
  .cite-link {
    display: flex; align-items: center; gap: 6px; font-size: 0.78rem;
    color: var(--accent-strong); background: var(--surface); border: 1px solid var(--border);

  function canView(page, user) {
    if (!page.private) return true;
    if (!user) return false;
    if (user.role === "admin") return true;
    return page.cat === user.dept;
  }

  function currentUser() {
    return USERS.find(function (u) { return u.id === state.currentUserId; }) || null;

  function toast(msg) {
    var stack = document.getElementById("toast-stack");
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(function () {
      el.style.opacity = "0";
      el.style.transition = "opacity 200ms ease";
      setTimeout(function () { stack.removeChild(el); }, 220);
    }, 2600);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function catLabel(id) {
    var c = CATEGORIES.find(function (c) { return c.id === id; });
    return c ? c.label : id;
  }

  function applyGlossaryLinks(escapedText, excludePageId) {
    var terms = GLOSSARY.slice().sort(function (a, b) { return b.term.length - a.term.length; });
    var result = escapedText;
    terms.forEach(function (g) {
      if (g.pageId === excludePageId) return;
      var target = PAGES.find(function (p) { return p.id === g.pageId; });
      if (!target) return;
      var re = new RegExp(g.term, "g");
      result = result.replace(re, '<span class="auto-link" data-open-page="' + g.pageId + '">' + g.term + "</span>");
    });
    return result;
  }

  function linkify(text, excludePageId) {
    return applyGlossaryLinks(esc(text), excludePageId);
  }

  function renderMarkdown(text, pageId) {
    var blocks = [];
    function stash(html) { blocks.push(html); return "\n\n@@BLK" + (blocks.length - 1) + "@@\n\n"; }

    var src = esc(text);

    src = src.replace(/```([\s\S]*?)```/g, function (_, code) {
      return stash('<pre class="code-block"><code>' + code.replace(/^\n/, "") + "</code></pre>");
    });

    var inline = [];
    src = src.replace(/`([^`\n]+)`/g, function (_, code) {
      inline.push("<code>" + code + "</code>");
      return "@@INL" + (inline.length - 1) + "@@";
    });

    src = src.replace(/(^\|.+\|[ \t]*\n\|[ \t]*[-:]+[-| \t:]*\|[ \t]*\n(?:\|.*\|[ \t]*\n?)+)/gm, function (block) {
      var rows = block.trim().split("\n");
      var header = rows[0].split("|").slice(1, -1).map(function (c) { return c.trim(); });
      var bodyRows = rows.slice(2).map(function (r) { return r.split("|").slice(1, -1).map(function (c) { return c.trim(); }); });
      var thead = "<tr>" + header.map(function (h) { return "<th>" + h + "</th>"; }).join("") + "</tr>";
      var tbody = bodyRows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("");
      return stash('<div class="md-table-wrap"><table class="md-table"><thead>' + thead + "</thead><tbody>" + tbody + "</tbody></table></div>");
    });

    src = src.replace(/^### (.+)$/gm, function (_, t) { return stash('<h4 class="md-h">' + t + "</h4>"); });
    src = src.replace(/^## (.+)$/gm, function (_, t) { return stash('<h3 class="md-h">' + t + "</h3>"); });
    src = src.replace(/^# (.+)$/gm, function (_, t) { return stash('<h2 class="md-h">' + t + "</h2>"); });

    src = src.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");

    src = src.replace(/(^[-*] .+(\n[-*] .+)*)/gm, function (block) {
      var items = block.split("\n").map(function (l) { return l.replace(/^[-*] /, ""); });
      return stash("<ul>" + items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>");
    });

    src = applyGlossaryLinks(src, pageId);

    var html = src.split(/\n{2,}/).filter(function (c) { return c.trim() !== ""; }).map(function (chunk) {
      var lines = chunk.split("\n");
      var allBlocks = lines.every(function (l) { return /^@@BLK\d+@@$/.test(l.trim()); });
      if (allBlocks) return lines.join("");
      return "<p>" + chunk.replace(/\n/g, "<br>") + "</p>";
    }).join("");

    html = html.replace(/@@BLK(\d+)@@/g, function (_, i) { return blocks[Number(i)]; });
    html = html.replace(/@@INL(\d+)@@/g, function (_, i) { return inline[Number(i)]; });

    return html;
  }

  function renderProse(text, pageId) {
    return renderMarkdown(text, pageId);
  }


  function getChildren(pageId, user) {
    return PAGES.filter(function (p) { return p.parentId === pageId && !p.archived && canView(p, user); });
  }

  function getBacklinks(pageId, user) {
    var seen = {};
    var result = [];
    PAGES.forEach(function (p) {
      if (p.id === pageId || p.archived || !canView(p, user)) return;
      var hit = GLOSSARY.some(function (g) { return g.pageId === pageId && p.body.indexOf(g.term) !== -1; });
      if (hit && !seen[p.id]) { seen[p.id] = true; result.push(p); }
    });
    return result;
  }

  /* ---------------- draft persistence ---------------- */
  function draftKey(d) {
    return "codex-draft:" + (d.id ? d.id : "new:" + (d.parentId || d.cat));

  function persistDraft() {
    try {
      var d = state.editDraft;
      var payload = { title: d.title, body: d.body, tags: d.tags, cat: d.cat, private: d.private, savedAt: new Date().toLocaleString("ja-JP", { hour12: false }) };
      localStorage.setItem(draftKey(d), JSON.stringify(payload));
    } catch (e) { /* localStorage unavailable */ }
  }
  function loadDraft(key) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function clearDraft(key) {
    try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
  }

  function askChat(text) {
    state.chatLog.push({ role: "user", text: text });
    var hit = CHAT_ANSWERS.find(function (a) {
      return a.match.some(function (m) { return text.indexOf(m) !== -1; });

      state.chatLog.push({ role: "ai", text: "関連するページが見つかりませんでした。別のキーワードで質問してみてください。", denied: false, cites: [] });

      var page = PAGES.find(function (p) { return p.id === hit.pageId; });
      if (page.archived) {
        state.chatLog.push({ role: "ai", denied: false, text: "該当するページは現在アーカイブされており、参照できません。", cites: [] });
      } else if (page.private) {
        state.chatLog.push({
          role: "ai",
          denied: true,
          text: "該当する情報は非公開ページに含まれています。現在AIチャットは全社公開ページのみを対象としているため、この内容には回答できません。ページを直接ご確認ください。",
          cites: []
        });
      } else {
        state.chatLog.push({ role: "ai", denied: false, text: hit.answer, cites: [{ id: page.id, title: page.title }] });
      }
    }
    render();
    var log = document.querySelector(".chat-log");
    if (log) log.scrollTop = log.scrollHeight;
  }

  function renderChat() {
    var u = currentUser();
    var msgs = state.chatLog.map(function (m) {
      if (m.role === "user") {
        return '<div class="msg user"><div class="bubble">' + esc(m.text) + '</div></div>';
      }
      var cites = m.cites && m.cites.length
        ? '<div class="cite-list">' + m.cites.map(function (c) {
            return '<div class="cite-link" data-open-page="' + c.id + '" data-close-chat="1">' + ICONS.file + '<span>' + esc(c.title) + '</span></div>';
          }).join("") + '</div>'
        : "";
      return '<div class="msg ai"><div class="bubble' + (m.denied ? " denied" : "") + '">' + esc(m.text) + cites + '</div></div>';
    }).join("");

    var suggest = state.chatLog.length === 0
      ? '<div class="chat-suggest">' + chatSuggestions().map(function (s) {
          return '<button data-suggest="' + esc(s) + '">' + esc(s) + '</button>';
        }).join("") + '</div>'
      : "";

    return (
      '<div id="chat-panel">' +
        '<div class="chat-head"><div class="mark">' + ICONS.brand + '</div><div><strong>テクWiki AI</strong><div class="sub">閉域環境のみで動作・社外送信なし</div></div>' +
          '<button class="icon-btn chat-close" id="btn-chat-close">' + ICONS.close + '</button></div>' +
        '<div class="chat-scope">' + esc(u ? u.name : "") + ' として質問中 ・回答は全社公開ページの内容に限定されます(MVP)</div>' +
        '<div class="chat-log">' + (msgs || '<div class="empty-note">気になることを質問してみてください</div>') + '</div>' +
        suggest +
        '<div class="chat-input-row"><input id="chat-input" placeholder="質問を入力..."><button class="chat-send" id="btn-chat-send">' + ICONS.send + '</button></div>' +
      '</div>'
    );
  }

  /* ---------------- main render ---------------- */
  function render() {
    var root = document.getElementById("root");
    if (state.screen === "login") {
      root.innerHTML = renderLogin();
      bindLogin();
      return;
    }

    var mainBody;
    if (state.screen === "home") mainBody = renderHome();
    else if (state.screen === "detail") mainBody = renderDetail();
    else if (state.screen === "edit") mainBody = renderEdit();
    else if (state.screen === "admin") mainBody = renderAdmin();
    else if (state.screen === "template-pick") mainBody = renderTemplatePick();
    else if (state.screen === "faq") mainBody = renderFaq();
    else if (state.screen === "guidelines") mainBody = renderGuidelines();
    else if (state.screen === "import") mainBody = renderImport();
    else if (state.screen === "contact") mainBody = renderContact();
    else if (state.screen === "inquiry-admin") mainBody = renderInquiryAdmin();
    else if (state.screen === "archive") mainBody = renderArchive();

    root.innerHTML =
      '<div id="view-app">' +
        renderSidebar() +
        '<div class="main-col">' +
          renderTopbar() +
          renderNotifDropdown() +
          renderUserDropdown() +
          '<main>' + mainBody + renderMobileBottomNav() + '</main>' +
        '</div>' +
      '</div>' +
      '<div id="chat-overlay" class="' + (state.chatOpen ? "open" : "") + '">' + renderChat() + '</div>';

    bindApp();
    ensureAutosave();
  }

  var autosaveTimer = null;
  function ensureAutosave() {
    if (state.screen === "edit") {
      if (!autosaveTimer) {
        autosaveTimer = setInterval(function () {
          var ta = document.getElementById("ed-body");
          var ti = document.getElementById("ed-title");
          if (!ta || !ti || !state.editDraft) return;
          state.editDraft.title = ti.value;
          state.editDraft.body = ta.value;
          persistDraft();
        }, 8000);
      }
    } else if (autosaveTimer) {
      clearInterval(autosaveTimer);
      autosaveTimer = null;
    }
  }

  /* ---------------- events: login ---------------- */
  function bindLogin() {
    var email = document.getElementById("in-email");
    var pass = document.getElementById("in-pass");
    email.addEventListener("input", function (e) { state.loginEmail = e.target.value; });
    pass.addEventListener("input", function (e) { state.loginPass = e.target.value; });
    document.getElementById("btn-login").addEventListener("click", doLogin);
    [email, pass].forEach(function (el) {
      el.addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
    });
  }

  function doLogin() {
    var email = state.loginEmail.trim();
    var domain = email.split("@")[1];
    if (!email || !domain) {
      state.loginError = "メールアドレスを入力してください";
      render();
      return;
    }
    if (domain.toLowerCase() !== ORG_DOMAIN) {
      state.loginError = "組織のメールアドレス（@" + ORG_DOMAIN + "）でログインしてください";
      render();
      return;
    }
    if (!state.loginPass) {
      state.loginError = "パスワードを入力してください";
      render();
      return;
    }
    var local = email.split("@")[0].toLowerCase();
    var match = USERS.find(function (u) {
      return local.indexOf(u.id) !== -1 || u.id.indexOf(local) !== -1;
    });
    state.currentUserId = match ? match.id : "tanaka";
    state.loginError = "";
    state.screen = "home";
    state.notifications = [{ text: "「経費精算のやり方」が更新されました", when: "2026-08-28 14:03", read: true }];
    render();
    toast("ログインしました");
  }

  /* ---------------- events: app ---------------- */
  function bindApp() {
    document.querySelectorAll("[data-goto-cat]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.screen = "home"; state.activeCat = el.getAttribute("data-goto-cat");
        state.query = ""; state.activeTag = null; render();
        window.scrollTo(0, 0);
      });
    });
    document.querySelectorAll("[data-goto]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.screen = el.getAttribute("data-goto"); render();
        window.scrollTo(0, 0);
      });
    });

    document.querySelectorAll("[data-toggle-tag]").forEach(function (el) {
      el.addEventListener("click", function () {
        var t = el.getAttribute("data-toggle-tag");
        state.activeTag = state.activeTag === t ? null : t; render();
      });
    });
    document.querySelectorAll("[data-open-page]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.activePageId = el.getAttribute("data-open-page");
        state.screen = "detail"; state.detailTab = "body";
        if (el.hasAttribute("data-close-chat")) state.chatOpen = false;
        render();
        window.scrollTo(0, 0);
      });
    });
    document.querySelectorAll("[data-tab]").forEach(function (el) {
      el.addEventListener("click", function () { state.detailTab = el.getAttribute("data-tab"); render(); });
    });

    var searchEl = document.getElementById("in-search");
    if (searchEl) {
      searchEl.addEventListener("input", function (e) {
        state.query = e.target.value; state.screen = "home"; render();
        setTimeout(function () {
          var s = document.getElementById("in-search");
          if (s) { s.focus(); s.selectionStart = s.selectionEnd = s.value.length; }
        }, 0);
      });
    }

    var newPageBtn = document.getElementById("btn-new-page");
    if (newPageBtn) newPageBtn.addEventListener("click", function () {
      state.pendingNewPage = { cat: state.activeCat === "all" ? "all" : state.activeCat, parentId: null };
      state.screen = "template-pick"; render();
    });

    var newSubBtn = document.getElementById("btn-new-subpage");
    if (newSubBtn) newSubBtn.addEventListener("click", function () {
      var page = PAGES.find(function (p) { return p.id === state.activePageId; });
      state.pendingNewPage = { cat: page.cat, parentId: page.id };
      state.screen = "template-pick"; render();
    });

    document.querySelectorAll("[data-pick-template]").forEach(function (el) {
      el.addEventListener("click", function () {
        var tpl = TEMPLATES.find(function (t) { return t.id === el.getAttribute("data-pick-template"); });
        var pending = state.pendingNewPage || { cat: state.activeCat, parentId: null };
        state.editDraft = { id: null, cat: pending.cat, parentId: pending.parentId, title: tpl.title, tags: [], body: tpl.body, private: false };
        state.editPreview = false;
        var draft = loadDraft(draftKey(state.editDraft));
        state.editDraftRestorable = (draft && (draft.body !== state.editDraft.body || draft.title !== state.editDraft.title)) ? draft : null;
        state.screen = "edit"; render();
      });
    });

    var templateCancel = document.getElementById("btn-template-cancel");
    if (templateCancel) templateCancel.addEventListener("click", function () {
      var pending = state.pendingNewPage;
      if (pending && pending.parentId) { state.activePageId = pending.parentId; state.screen = "detail"; }
      else { state.screen = "home"; }
      render();
    });

    var editBtn = document.getElementById("btn-edit-page");
    if (editBtn) editBtn.addEventListener("click", function () {
      var page = PAGES.find(function (p) { return p.id === state.activePageId; });
      state.editDraft = { id: page.id, cat: page.cat, parentId: page.parentId || null, title: page.title, tags: page.tags.slice(), body: page.body, private: page.private };
      state.editPreview = false;
      var draft = loadDraft(draftKey(state.editDraft));
      state.editDraftRestorable = (draft && (draft.body !== page.body || draft.title !== page.title)) ? draft : null;
      state.screen = "edit"; render();
    });

    var archiveBtn = document.getElementById("btn-archive-page");
    if (archiveBtn) archiveBtn.addEventListener("click", function () {
      var page = PAGES.find(function (p) { return p.id === state.activePageId; });
      page.archived = true;
      render();
      toast("ページをアーカイブしました");
    });
    var unarchiveBtn = document.getElementById("btn-unarchive-page");
    if (unarchiveBtn) unarchiveBtn.addEventListener("click", function () {
      var page = PAGES.find(function (p) { return p.id === state.activePageId; });
      page.archived = false;
      render();
      toast("アーカイブを解除しました");
    });
    document.querySelectorAll("[data-unarchive]").forEach(function (el) {
      el.addEventListener("click", function () {
        var page = PAGES.find(function (p) { return p.id === el.getAttribute("data-unarchive"); });
        if (page) page.archived = false;
        render();
        toast("アーカイブを解除しました");
      });
    });
    document.querySelectorAll("[data-delete-page]").forEach(function (el) {
      el.addEventListener("click", function () {
        if (!confirm("このページを完全に削除します。元に戻せません。よろしいですか？")) return;
        var idx = PAGES.findIndex(function (p) { return p.id === el.getAttribute("data-delete-page"); });
        if (idx !== -1) PAGES.splice(idx, 1);
        render();
        toast("ページを削除しました");
      });
    });

    var cancelEdit = document.getElementById("btn-cancel-edit");
    if (cancelEdit) cancelEdit.addEventListener("click", function () {
      var d = state.editDraft;
      if (d.id) { state.screen = "detail"; }
      else if (d.parentId) { state.activePageId = d.parentId; state.screen = "detail"; }
      else { state.screen = "home"; }
      render();
    });

    function syncEditDraftFromForm() {
      var ta = document.getElementById("ed-body");
      var ti = document.getElementById("ed-title");
      if (ta) state.editDraft.body = ta.value;
      if (ti) state.editDraft.title = ti.value;
    }

    var catSelect = document.getElementById("ed-cat");
    if (catSelect && catSelect.tagName === "SELECT") {
      catSelect.addEventListener("change", function (e) {
        syncEditDraftFromForm();
        state.editDraft.cat = e.target.value;
        render();
      });
    }

    var tagInput = document.getElementById("ed-tag-input");
    if (tagInput) tagInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target.value.trim()) {
        syncEditDraftFromForm();
        state.editDraft.tags.push(e.target.value.trim());
        render();
      }
    });
    document.querySelectorAll("[data-remove-tag]").forEach(function (el) {
      el.addEventListener("click", function () {
        syncEditDraftFromForm();
        state.editDraft.tags.splice(Number(el.getAttribute("data-remove-tag")), 1);
        render();
      });
    });

    var writeBtn = document.getElementById("btn-edit-write");
    if (writeBtn) writeBtn.addEventListener("click", function () { state.editPreview = false; render(); });
    var previewBtn = document.getElementById("btn-edit-preview");
    if (previewBtn) previewBtn.addEventListener("click", function () { syncEditDraftFromForm(); state.editPreview = true; render(); });

    document.querySelectorAll("[data-md-insert]").forEach(function (el) {
      el.addEventListener("click", function () {
        var ta = document.getElementById("ed-body");
        if (!ta) return;
        var snippets = {
          heading: ["## ", ""], bold: ["**", "**"], list: ["- ", ""],
          code: ["`", "`"], codeblock: ["```\n", "\n```"],
          table: ["", "| 列1 | 列2 |\n| --- | --- |\n| a | b |"]
        };
        var pair = snippets[el.getAttribute("data-md-insert")];
        var start = ta.selectionStart, end = ta.selectionEnd;
        var selected = ta.value.slice(start, end);
        var inserted = pair[0] + selected + pair[1];
        ta.value = ta.value.slice(0, start) + inserted + ta.value.slice(end);
        syncEditDraftFromForm();
        ta.focus();
        var cursorPos = start + pair[0].length + selected.length;
        ta.selectionStart = ta.selectionEnd = cursorPos;
      });
    });

    var saveDraftBtn = document.getElementById("btn-save-draft");
    if (saveDraftBtn) saveDraftBtn.addEventListener("click", function () {
      syncEditDraftFromForm();
      persistDraft();
      toast("下書きを保存しました");
    });
    var restoreDraftBtn = document.getElementById("btn-restore-draft");
    if (restoreDraftBtn) restoreDraftBtn.addEventListener("click", function () {
      var draft = state.editDraftRestorable;
      if (draft) {
        state.editDraft.title = draft.title; state.editDraft.body = draft.body;
        state.editDraft.tags = draft.tags || [];
        state.editDraft.private = !!draft.private;
        if (!state.editDraft.parentId) state.editDraft.cat = draft.cat || state.editDraft.cat;
      }
      state.editDraftRestorable = null;
      render();
      toast("下書きを復元しました");
    });
    var discardDraftBtn = document.getElementById("btn-discard-draft");
    if (discardDraftBtn) discardDraftBtn.addEventListener("click", function () {
      clearDraft(draftKey(state.editDraft));
      state.editDraftRestorable = null;
      render();
    });

    var submitBtn = document.getElementById("btn-submit-approval");
    if (submitBtn) submitBtn.addEventListener("click", function () {
      syncEditDraftFromForm();
      var d = state.editDraft;
      var title = d.title.trim() || "無題のページ";
      var body = d.body;
      var cat = document.getElementById("ed-cat").value;
      var isPrivate = document.getElementById("ed-private").checked;
      var existing = d.id ? PAGES.find(function (p) { return p.id === d.id; }) : null;
      var u = currentUser();
      var catDef = CATEGORIES.find(function (c) { return c.id === cat; });
      var needsApproval = catDef ? catDef.requiresApproval : true;
      var newData = { title: title, body: body, cat: cat, private: isPrivate, tags: d.tags, parentId: d.parentId || null };

      if (needsApproval) {
        state.pendingApprovals.push({
          pageId: d.id, title: title, cat: cat, author: u.name,
          when: "たった今",
          before: existing ? existing.body.slice(0, 70) + "..." : "(新規ページ)",
          after: body.slice(0, 70) + "...",
          newData: newData
        });
        state.notifications.push({ text: "「" + title + "」が承認待ちになりました", when: "たった今", read: false });
        clearDraft(draftKey(d));
        state.editDraftRestorable = null;
        state.screen = existing ? "detail" : "home";
        render();
        toast("承認待ちとして送信しました");
      } else {
        if (existing) {
          existing.title = newData.title; existing.body = newData.body; existing.cat = newData.cat;
          existing.private = newData.private; existing.tags = newData.tags;
          existing.updatedAt = "たった今"; existing.updatedBy = u.name;
          existing.history.unshift({ who: u.name, when: "たった今", what: "内容を更新" });
          state.activePageId = existing.id;
        } else {
          var newId = "p" + (PAGES.length + 1);
          PAGES.push({
            id: newId, cat: newData.cat, parentId: newData.parentId, title: newData.title,
            tags: newData.tags, private: newData.private, updatedBy: u.name,
            updatedAt: "たった今", body: newData.body, attachments: [],
            history: [{ who: u.name, when: "たった今", what: "初版作成" }]
          });
          state.activePageId = newId;
        }
        clearDraft(draftKey(d));
        state.editDraftRestorable = null;
        state.screen = "detail";
        render();
        toast("公開しました");
      }
    });

    document.querySelectorAll("[data-approve]").forEach(function (el) {
      el.addEventListener("click", function () {
        var idx = Number(el.getAttribute("data-approve"));
        var item = state.pendingApprovals[idx];
        var existing = item.pageId ? PAGES.find(function (p) { return p.id === item.pageId; }) : null;
        if (existing) {
          existing.title = item.newData.title; existing.body = item.newData.body;
          existing.cat = item.newData.cat; existing.private = item.newData.private; existing.tags = item.newData.tags;
          existing.updatedAt = "たった今"; existing.updatedBy = item.author;
          existing.history.unshift({ who: item.author, when: "たった今", what: "内容を更新（承認済み）" });
        } else {
          PAGES.push({
            id: "p" + (PAGES.length + 1), cat: item.newData.cat, parentId: item.newData.parentId || null, title: item.newData.title,
            tags: item.newData.tags, private: item.newData.private, updatedBy: item.author,
            updatedAt: "たった今", body: item.newData.body, attachments: [],
            history: [{ who: item.author, when: "たった今", what: "初版作成（承認済み）" }]
          });
        }
        state.pendingApprovals.splice(idx, 1);
        render();
        toast("承認しました。ページを公開しました");
      });
    });
    document.querySelectorAll("[data-reject]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.pendingApprovals.splice(Number(el.getAttribute("data-reject")), 1);
        render();
        toast("差し戻しました");
      });
    });

    var sendInquiryBtn = document.getElementById("btn-send-inquiry");
    if (sendInquiryBtn) sendInquiryBtn.addEventListener("click", function () {
      var subject = document.getElementById("cn-subject").value.trim();
      var body = document.getElementById("cn-body").value.trim();
      if (!subject || !body) { toast("件名と内容を入力してください"); return; }
      var type = document.getElementById("cn-type").value;
      var u = currentUser();
      state.inquiries.push({
        id: "iq" + (state.inquiries.length + 1), type: type, subject: subject, body: body,
        authorId: u.id, authorName: u.name, when: "たった今", status: "open"
      });
      render();
      toast("お問い合わせを送信しました");
    });

    document.querySelectorAll("[data-resolve-inquiry]").forEach(function (el) {
      el.addEventListener("click", function () {
        var item = state.inquiries.find(function (i) { return i.id === el.getAttribute("data-resolve-inquiry"); });
        if (item) item.status = "resolved";
        render();
        toast("対応済みにしました");
      });
    });

    var notifBtn = document.getElementById("btn-notif");
    if (notifBtn) notifBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      state.notifOpen = !state.notifOpen; state.userMenuOpen = false;
      state.notifications.forEach(function (n) { n.read = true; });
      render();
    });
    var userBtn = document.getElementById("btn-user");
    if (userBtn) userBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      state.userMenuOpen = !state.userMenuOpen; state.notifOpen = false; render();
    });
    document.querySelectorAll("[data-switch-user]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.currentUserId = el.getAttribute("data-switch-user");
        state.userMenuOpen = false; state.screen = "home"; state.activeCat = "all";
        render();
        toast("ユーザーを切り替えました");
      });
    });
    var logoutBtn = document.getElementById("btn-logout");
    if (logoutBtn) logoutBtn.addEventListener("click", function () {
      state.screen = "login"; state.currentUserId = null; state.loginEmail = ""; state.loginPass = "";
      state.chatLog = []; render();
    });

    var chatOpenBtn = document.getElementById("btn-chat-open");
    if (chatOpenBtn) chatOpenBtn.addEventListener("click", function () { state.chatOpen = true; render(); focusChat(); });
    var chatCloseBtn = document.getElementById("btn-chat-close");
    if (chatCloseBtn) chatCloseBtn.addEventListener("click", function () { state.chatOpen = false; render(); });
    var overlay = document.getElementById("chat-overlay");
    if (overlay) overlay.addEventListener("click", function (e) { if (e.target === overlay) { state.chatOpen = false; render(); } });

    var chatSend = document.getElementById("btn-chat-send");
    var chatInputEl = document.getElementById("chat-input");
    if (chatSend) chatSend.addEventListener("click", function () { sendChatFromInput(); });
    if (chatInputEl) chatInputEl.addEventListener("keydown", function (e) { if (e.key === "Enter") sendChatFromInput(); });
    document.querySelectorAll("[data-suggest]").forEach(function (el) {
      el.addEventListener("click", function () { askChat(el.getAttribute("data-suggest")); });
    });

    document.addEventListener("click", closeMenusOnce, { once: true });
  }

  function closeMenusOnce() {
    if (state.notifOpen || state.userMenuOpen) {
      state.notifOpen = false; state.userMenuOpen = false; render();
    }
  }

  function focusChat() {
    setTimeout(function () {
      var el = document.getElementById("chat-input");
      if (el) el.focus();
    }, 220);
  }

  function sendChatFromInput() {
    var el = document.getElementById("chat-input");
    var val = el.value.trim();
    if (!val) return;
    el.value = "";
    askChat(val);
  }

  render();
})();
</script>
</body>
</html>
